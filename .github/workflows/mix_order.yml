name: mix_order

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
#   cancel-in-progress: true

jobs:
  default:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu] #[ubuntu, macos, windows]
        python-version: ["3.12"] #["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Query GitHub commit date
        run: |
          COMMIT_HASH="7cd7d521"
          API_URL="https://api.github.com/repos/networkx/networkx/commits/$COMMIT_HASH"
          DATE=$(curl -s $API_URL | jq -r '.commit.committer.date')
          echo "commit_date=${DATE}" >> $GITHUB_ENV

      - name: Install uv package manager
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install packages with uv
        run: |
          uv pip install -r requirements/default.txt -r requirements/test.txt --exclude-newer ${{ env.commit_date }} --system
          uv pip install . --exclude-newer ${{ env.commit_date }} --system
          uv pip list

      - name: Install pytest-ranking related
        run: pip install pytest-ranking pytest-json-report
      
      - name: Test for warnings at import time
        run: python -Werror -c "import networkx"
      
      - name: Restore pytest-ranking cache
        id: restore-pytest-ranking-cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.python }}

      - name: Test NetworkX
        run: |
          pytest --doctest-modules -v --durations=0 --json-report --json-report-file=./test-report.json --pyargs networkx --rank --rank-weight=1-1-1 --rank-level=method

      - name: Save pytest-ranking cache
        id: save-pytest-ranking-cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
            name: pytest-ranking upload test report json
            path: |
              ./test-report.json
